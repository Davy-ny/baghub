{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h4>Payment Status</h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-spinner fa-spin fa-3x mb-3"></i>
                    <p>Waiting for payment confirmation...</p>
                    <p>Order #{{ order.id }} – Amount: KSh {{ order.total_amount }}</p>
                    <hr>
                    <a href="{% url 'payment:payment_status' order.id %}" class="btn btn-primary">
                        <i class="fas fa-sync-alt"></i> Refresh Status
                    </a>
                    <a href="{% url 'products:product_list' %}" class="btn btn-secondary">
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Auto-refresh every 5 seconds (optional)
    setTimeout(() => {
        location.reload();
    }, 5000);
</script>
{% endblock %}
